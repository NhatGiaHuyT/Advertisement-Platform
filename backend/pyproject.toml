[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "project's backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.0",
    "pytest",
    "pytest-asyncio",
    "pydantic",
    "pydantic[email]",
    "python-dotenv",
    "psycopg",
    "psycopg_pool",
    "regex",
    "argon2-cffi",
    "pypika",
    "types-regex",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
addopts = ["-v", "--strict-markers", "--tb=short", "--disable-warnings"]
env = ["ENVIRONMENT=pytest", "PYTEST_CURRENT_TEST=true"]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Integration tests that may require external services",
    "asyncio: Tests that use asyncio",
    "slow: marks tests as slow running",
]

[tool.mypy]
mypy_path = "src"
files = ["src"]

python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
namespace_packages = true
explicit_package_bases = true
strict = true

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID", "W", "B"]
ignore = []
extend-select = ["UP006", "UP007", "UP035", "UP039", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
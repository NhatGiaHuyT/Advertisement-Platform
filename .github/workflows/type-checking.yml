name: Type Checking

on:
    push:
      paths:
        - 'backend/**'
        - '.github/workflows/type-checking.yml'
    pull_request:
      paths:
        - 'backend/**'
        - '.github/workflows/type-checking.yml'

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Sync workspace
        run: |
          uv sync
      
      - name: Mypy
        run: |
          uv run --no-sync mypy .
        env:
          ENVIRONMENT: test
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

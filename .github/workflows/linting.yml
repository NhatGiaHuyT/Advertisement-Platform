name: Linting

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Goto Backend/
        run: |
          cd backend

      - name: Sync workspace
        run: |
          uv sync --extra dev

      - name: Ruff lint
        run: |
          uv run --no-sync ruff check
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Goto Backend/
        run: |
          cd backend
      
      - name: Sync workspace
        run: |
          uv sync --extra dev

      - name: Pytest
        run: |
          uv run --no-sync pytest
        env:
          ENVIRONMENT: test
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

